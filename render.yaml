services:
  - type: web
    name: ai-video-assistant
    runtime: python
    plan: free
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: YOUTUBE_COOKIES_B64
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
